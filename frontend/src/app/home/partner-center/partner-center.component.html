<button mat-icon-button class="back-button" (click)="onBack()" disableRipple>
  <mat-icon class="back-icon">keyboard_arrow_left</mat-icon>
</button>
<div style="display:flex;justify-content: flex-start;width:100%; height:80%; margin:10px 0 0 20px;">
  <div class="sidenav-partner">
    <h2 style="color:#97A7C3">Partner</h2>
    <hr>
    <mat-list>
      <div *ngFor="let organization of organizations">
        <mat-list-item (click)="onSelectPartner(organization)" matRipple>{{organization.organizationName}}
          <mat-icon>chevron_right</mat-icon>
        </mat-list-item>
        <mat-divider></mat-divider>
      </div>
    </mat-list>
  </div>
  <div class="home-partner" *ngIf="selectedPartner !== undefined">
    <app-view-partner [selectedPartner]="selectedPartner"></app-view-partner>
  </div>
</div>
